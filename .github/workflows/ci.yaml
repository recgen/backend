name: CI

on:
  pull_request:
    branches:
      - dev
  push:
    paths:
      - 'src/**'
      - 'tests/**'
    branches:
      - dev

jobs:
  sync:
    name: sync dependencies
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: restore venv
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: .venv
          key: ${{ runner.os }}-${{ hashFiles('uv.lock') }}

      - name: Install uv
        if: steps.cache.outputs.cache-hit != 'true'
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.17"
          enable-cache: true

      - name: sync dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: uv sync --locked --all-extras --dev

      - name: cache venv
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .venv
          key: ${{ runner.os }}-${{ hashFiles('uv.lock') }}

  unit-testing:
    name: unit testing
    runs-on: ubuntu-latest
    needs: sync

    steps:
      - uses: actions/checkout@v6

      - name: restore venv
        uses: actions/cache/restore@v4
        with:
          path: .venv
          key: ${{ runner.os }}-${{ hashFiles('uv.lock') }}

      - name: unit testing
        run: |
          source .venv/bin/activate
          pytest tests/unit

  workflow-testing:
    name: workflow testing
    runs-on: ubuntu-latest
    needs: unit-testing

    steps:
      - uses: actions/checkout@v6

      - name: restore venv
        uses: actions/cache/restore@v4
        with:
          path: .venv
          key: ${{ runner.os }}-${{ hashFiles('uv.lock') }}

      - name: activate venv
        run: source .venv/bin/activate

      - name: workflow testing
        run: |
          source .venv/bin/activate
          pytest tests/workflow
