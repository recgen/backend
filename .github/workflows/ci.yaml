name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - dev
  push:
    paths:
      - 'src/**'
      - 'tests/**'
    branches:
      - dev

jobs:
  unit-testing:
    name: unit testing
    runs-on: ubuntu-latest
    needs: sync

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/uv

      - name: unit testing
        run: uv run pytest tests/unit

  workflow-testing:
    name: workflow testing
    runs-on: ubuntu-latest
    needs: unit-testing

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/uv

      - name: workflow testing
        run: uv run pytest tests/workflow
