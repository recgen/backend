

services:
  api:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    develop:
      watch:
        - action: sync
          path: .
          target: /app
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:18-alpine
    # env_file: ".dev.env"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d testdb -h 127.0.0.1 -p 5432" ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s



volumes:
  postgres_data:
